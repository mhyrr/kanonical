baseURL = "https://www.kanonical.io/"
languageCode = "en-us"
title = "Kanonical"

[params]
  author = "Greg Olsen"
  description = "Everything you never wanted to know about what I think and how I do."
  github = "https://github.com/mhyrr"
  twitter = "mhyrr"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    codeFences = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow raw HTML in markdown

[outputs]
  home = ["HTML", "RSS"]

