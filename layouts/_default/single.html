{{ define "main" }}
<article class="prose max-w-none">
  <header class="mb-10 not-prose">
    <h1 class="text-3xl md:text-4xl font-bold leading-tight mb-3">{{ .Title }}</h1>
    <div class="text-sub flex items-center gap-3 font-sans text-sm">
      <time datetime="{{ .Date.Format "2006-01-02" }}">
        {{ .Date.Format "January 2, 2006" }}
      </time>
      <span class="text-primary">·</span>
      <span>{{ .ReadingTime }} min read</span>
      {{ with .Params.type }}
        <span class="text-primary">·</span>
        <span class="text-secondary capitalize">{{ . }}</span>
      {{ end }}
    </div>
  </header>

  <div class="section-divider not-prose"><span class="ornament">✦</span></div>

  {{ .Content }}
</article>

<nav class="mt-20 pt-8 border-t border-overlay flex justify-between gap-4 font-sans text-sm">
  {{ with .PrevInSection }}
    <a href="{{ .RelPermalink }}" class="link group flex items-center gap-2">
      <span class="text-primary group-hover:text-accent transition-colors">←</span>
      <span class="truncate max-w-[200px]">{{ .Title }}</span>
    </a>
  {{ else }}
    <span></span>
  {{ end }}
  {{ with .NextInSection }}
    <a href="{{ .RelPermalink }}" class="link group flex items-center gap-2 text-right">
      <span class="truncate max-w-[200px]">{{ .Title }}</span>
      <span class="text-primary group-hover:text-accent transition-colors">→</span>
    </a>
  {{ end }}
</nav>
{{ end }}
