<header id="site-header" class="sticky top-0 z-50 bg-base/95 backdrop-blur-sm border-b border-overlay/50">
  <nav class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    {{/* Logo / Home */}}
    <a href="/" class="group">
      <span class="font-sans text-base sm:text-lg">
        Hi I'm <strong class="text-primary font-semibold">Greg</strong>.
        <span class="text-sub text-sm ml-1 hidden sm:inline">Occasionally I do things.</span>
      </span>
    </a>

    {{/* Desktop Navigation */}}
    <ul class="hidden md:flex items-center gap-6">
      {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" class="nav-link">
            {{ .Name }}
          </a>
        </li>
      {{ end }}
      {{/* Dark mode toggle */}}
      <li>
        <button onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-surface transition-colors" aria-label="Toggle theme">
          {{/* Sun icon (shown in dark mode) */}}
          <svg class="w-5 h-5 hidden dark:block text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          {{/* Moon icon (shown in light mode) */}}
          <svg class="w-5 h-5 block dark:hidden text-sub" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </li>
    </ul>

    {{/* Mobile menu button */}}
    <button id="menu-toggle" class="md:hidden p-2 rounded-lg hover:bg-surface" aria-label="Toggle menu">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </nav>

  {{/* Mobile menu */}}
  <div id="mobile-menu" class="hidden md:hidden border-t border-overlay/50 bg-base">
    <ul class="px-6 py-4 space-y-3">
      {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" class="block nav-link py-2">
            {{ .Name }}
          </a>
        </li>
      {{ end }}
      <li class="pt-2 border-t border-overlay/50">
        <button onclick="toggleTheme()" class="flex items-center gap-2 text-sub hover:text-primary py-2 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          Toggle theme
        </button>
      </li>
    </ul>
  </div>
</header>
