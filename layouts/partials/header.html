<header class="fixed top-0 w-full z-50 bg-light/90 dark:bg-dark/90 backdrop-blur-sm transition-shadow" id="site-header">
  {{/* Reading progress bar */}}
  <div id="reading-progress" class="h-0.5 bg-primary w-0 transition-all"></div>

  <nav class="flex items-center justify-between p-4 max-w-3xl mx-auto">
    <a href="/" class="font-bold text-xl hover:text-primary transition-colors">
      Kanonical
    </a>

    {{/* Desktop nav */}}
    <ul class="hidden md:flex items-center gap-6">
      {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" class="hover:text-primary transition-colors">
            {{ .Name }}
          </a>
        </li>
      {{ end }}
      <li>
        <button onclick="toggleTheme()" class="p-2 hover:text-primary transition-colors" aria-label="Toggle theme">
          <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
          </svg>
          <svg class="w-5 h-5 block dark:hidden" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
          </svg>
        </button>
      </li>
    </ul>

    {{/* Mobile burger */}}
    <button id="menu-toggle" class="md:hidden p-2" aria-label="Toggle menu">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </nav>

  {{/* Mobile menu */}}
  <div id="mobile-menu" class="hidden md:hidden bg-light dark:bg-dark border-t border-dark/10 dark:border-light/10">
    <ul class="flex flex-col p-4 gap-4">
      {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" class="block hover:text-primary transition-colors">
            {{ .Name }}
          </a>
        </li>
      {{ end }}
      <li>
        <button onclick="toggleTheme()" class="hover:text-primary transition-colors">
          Toggle Theme
        </button>
      </li>
    </ul>
  </div>
</header>

{{/* Spacer for fixed header */}}
<div class="h-16"></div>
