[build]
  command = "./bin/fetch-sheets-linux && hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.142.0"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "./bin/fetch-sheets-linux && hugo --buildDrafts --buildFuture --minify"

[context.branch-deploy]
  command = "./bin/fetch-sheets-linux && hugo --buildDrafts --buildFuture --minify"

[[redirects]]
  from = "/feed/"
  to = "/index.xml"
  status = 301

[[redirects]]
  from = "/rss/"
  to = "/index.xml"
  status = 301

# Handle trailing slashes consistently
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
