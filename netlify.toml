[build]
  command = "rm -rf public && ./bin/fetch-sheets-linux && hugo --minify && ls -la public/ && ls public/index.html || echo 'NO INDEX.HTML!'"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.142.0"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "rm -rf public && ./bin/fetch-sheets-linux && hugo --buildDrafts --buildFuture --minify"

[context.branch-deploy]
  command = "rm -rf public && ./bin/fetch-sheets-linux && hugo --buildDrafts --buildFuture --minify"

[[redirects]]
  from = "/feed/"
  to = "/index.xml"
  status = 301

[[redirects]]
  from = "/rss/"
  to = "/index.xml"
  status = 301

